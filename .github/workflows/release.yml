name: Publish ALPD research preview

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/interaction-design-mvp.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: interaction-design-mvp/uv.lock
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('interaction-design-mvp/pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version
          assert pathlib.Path('docs/releases/' + os.environ['RELEASE_TAG'] + '.md').is_file()
          PY
      - name: Build checked release assets
        run: |
          bash tools/setup.sh --python 3.12
          uv build --project interaction-design-mvp --out-dir dist
          interaction-design-mvp/.venv/bin/python tools/build_site.py --output _site
          interaction-design-mvp/.venv/bin/python tools/verify_release.py --site _site
          interaction-design-mvp/.venv/bin/python tools/package_release.py --site _site --dist dist --output release-assets
          cd release-assets
          sha256sum --check SHA256SUMS
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$RELEASE_TAG" release-assets/*
          --verify-tag --prerelease --title "ALPD $RELEASE_TAG — Research Preview"
          --notes-file "docs/releases/$RELEASE_TAG.md"
