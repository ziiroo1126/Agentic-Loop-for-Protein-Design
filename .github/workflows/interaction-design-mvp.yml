name: Interaction Design MVP

on:
  push:
    paths:
      - "interaction-design-mvp/**"
      - ".github/workflows/interaction-design-mvp.yml"
  pull_request:
    paths:
      - "interaction-design-mvp/**"
      - ".github/workflows/interaction-design-mvp.yml"

permissions:
  contents: read

concurrency:
  group: interaction-design-mvp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    defaults:
      run:
        working-directory: interaction-design-mvp

    env:
      UV_NO_PROGRESS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: ${{ matrix.python-version }}
          working-directory: interaction-design-mvp
          enable-cache: true
          cache-dependency-glob: interaction-design-mvp/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Test
        run: uv run --no-sync pytest -q

      - name: Build distributions
        run: uv build
