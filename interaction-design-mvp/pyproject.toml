[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agentic-loop-protein-design"
version = "0.1.0"
description = "ALPD: agent-guided protein binder design, evaluation and traceable result export"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "ALPD contributors" }]
dependencies = [
  "evedesign @ git+https://github.com/evedesignbio/evedesign.git@05fa7ed4d882f886c98d8aa9042bcc4b6dcdb05f",
  "huggingface-hub>=1.30,<2",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6", "ruff>=0.12"]

[project.scripts]
alpd = "interaction_design.cli:main"
interaction-design = "interaction_design.cli:main"

[tool.hatch.build]
skip-excluded-dirs = true

[tool.hatch.build.targets.wheel]
packages = ["src/interaction_design"]

[tool.hatch.build.targets.wheel.force-include]
"config/assets.lock.toml" = "interaction_design/data/assets.lock.toml"
"config/ppi.xml" = "interaction_design/data/ppi.xml"
"config/ppi.NOTICE" = "interaction_design/data/ppi.NOTICE"
"config/ODESIGN_PIPELINE_LICENSE" = "interaction_design/data/ODESIGN_PIPELINE_LICENSE"
"scripts/esmfold_smoke.py" = "interaction_design/data/esmfold_smoke.py"
"scripts/esmfold_batch.py" = "interaction_design/data/esmfold_batch.py"
"scripts/esmfold2_batch.py" = "interaction_design/data/esmfold2_batch.py"
"config/esmfold2-ppi.protocol.json" = "interaction_design/data/esmfold2-ppi.protocol.json"
"config/interface-feedback.protocol.json" = "interaction_design/data/interface-feedback.protocol.json"
"config/external-benchmark-v1.json" = "interaction_design/data/external-benchmark-v1.json"
"scripts/import_anthropic_benchmark.py" = "interaction_design/data/import_anthropic_benchmark.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["interaction_design"]
